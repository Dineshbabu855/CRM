name: CI
on:
  pull_request: {}
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis-cache:
        image: redis:7
        ports:
          - 13000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis-queue:
        image: redis:7
        ports:
          - 11000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client redis-tools
      - name: Install bench via pipx
        run: |
          pipx install frappe-bench==5.*
      - name: Install lint tools
        run: pip install ruff
      - name: Initialize bench
        run: |
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" --frappe-branch "version-16" ~/frappe-bench
      - name: Setup bench requirements
        working-directory: /home/runner/frappe-bench
        run: bench setup requirements --dev
      - name: Get app
        working-directory: /home/runner/frappe-bench
        run: bench get-app crm $GITHUB_WORKSPACE
      - name: Create test site
        working-directory: /home/runner/frappe-bench
        run: bench new-site test_site --db-root-password root --admin-password admin
      - name: Install app
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site install-app crm
      - name: Enable tests on site
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site set-config allow_tests true
      - name: Lint with ruff
        run: ruff check .
      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site run-tests --app crm --skip-test-records
