name: CI

on:
  pull_request:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: dev-crm-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:7
        ports:
          - 13000:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=2s --health-retries=3
      redis-queue:
        image: redis:7
        ports:
          - 11000:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=2s --health-retries=3
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ hashFiles('**/package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: package-lock.json

      - name: Install MariaDB Client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Install frappe-bench
        run: |
          pip install frappe-bench

      - name: Initialize bench
        run: |
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" --frappe-branch "version-15" ~/frappe-bench

      - name: Get app
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app crm $GITHUB_WORKSPACE

      - name: Setup requirements
        working-directory: /home/runner/frappe-bench
        run: |
          bench setup requirements --dev

      - name: Create site
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site test_site --db-root-password root --admin-password admin

      - name: Install app
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site install-app crm

      - name: Build assets
        working-directory: /home/runner/frappe-bench
        continue-on-error: true
        run: |
          bench build

      - name: Enable tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site run-tests --app crm
        env:
          TYPE: server
